# ss.boos.uz — yagona production domen (meter-frontend-v2 + backend API proxy)
# Serverdagi asl nusxa: /etc/nginx/sites-available/meter (sites-enabled/meter orqali yoqilgan)
# SSL blok certbot tomonidan avtomatik qo'shilgan (--nginx -d ss.boos.uz)
#
# Eslatma: root katalogi ataylab /var/www/sss.boos.uz nomida QOLDIRILGAN (tarixiy sabab —
# ilgari shu katalog sss.boos.uz domeni uchun yaratilgan edi, keyinchalik ss.boos.uz shu
# katalogni serve qiladigan qilib qayta sozlandi). 2026-08-12 da katalogni qayta nomlashga
# urinilganda (mv + root path yangilash + reload) ishlab turgan nginx worker eski
# ma'lumotlar bilan "rewrite or internal redirection cycle" xatosi berib, saytni vaqtincha
# yiqitdi — sabab aniqlanmadi (ehtimol worker faol paytda katalog nomini o'zgartirish bilan
# bog'liq fd/keshlash muammosi). O'zgarish darhol qaytarildi va sayt tikladi. Shu sababli
# katalog nomini QAYTA O'ZGARTIRISHGA URINMANG oddiy mv+reload bilan — agar chindan ham
# kerak bo'lsa, faqat past-trafik oynada, to'liq `systemctl restart nginx` bilan (reload
# emas) va darhol tekshiruv bilan qiling.

server {
    listen 80 default_server;
    server_name ss.boos.uz 67.205.171.93;

    # Cloudflare real IP
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    real_ip_header CF-Connecting-IP;

    # WebSocket - redirect qilmaymiz
    location /ws {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600;
        proxy_send_timeout 3600;
    }

    # Qolgan barcha so'rovlar HTTPS ga redirect
    location / {
        return 301 https://ss.boos.uz$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    server_name ss.boos.uz 67.205.171.93;

    ssl_certificate     /etc/letsencrypt/live/ss.boos.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ss.boos.uz/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Cloudflare real IP
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    real_ip_header CF-Connecting-IP;

    root /var/www/sss.boos.uz;
    index index.html;

    location /ws {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600;
        proxy_send_timeout 3600;
    }

    # Katta Excel import (F3 va h.k.) uchun uzunroq timeout
    location ~ ^/api/(billing/import|territory/apartments/import) {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300;
        proxy_connect_timeout 10;
        proxy_send_timeout 300;
        client_max_body_size 60M;
    }

    location = /health {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60;
        proxy_connect_timeout 10;
        client_max_body_size 50M;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
