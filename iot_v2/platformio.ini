; =============================================================================
; Meter Monitor v2 — ESP32 Firmware (WiFi + RS-485 bino-ichi shinasi)
; =============================================================================
;
; iot_v2 iot'dan farqi: LoRa YO'Q. Har bir bino WiFi/internetga ega bo'lgani
; uchun bino ichidagi sensorlar RS-485 orqali bitta "bridge" ESP32'ga
; ulanadi, bridge esa oddiy WiFi orqali backend'ga POST qiladi (LoRa radio,
; mesh, gateway qurilmasi umuman kerak emas). Batafsil:
;   iot_v2/include/rs485_bus.h, rs485_leaf.h, rs485_bridge.h
;
; YANGI QURILMA QO'SHISH:
;   1. Quyidagi "KONFIGURATSIYA BAYROQLARI" bo'limini o'qing
;   2. Mos [env:...] ni toping yoki yangisini yarating
;   3. pio run -e <env_nomi> -t upload --upload-port COMxx
;
; ─────────────────────────────────────────────────────────────────────────────
; KONFIGURATSIYA BAYROQLARI (build_flags):
;
; [SENSOR — bittasini tanlang]
;   -DSENSOR_SOIL          → Tuproq namligi (kapasitiv ADC)
;   -DSENSOR_WATER         → Suv bosimi (2x analog ADC)
;   -DSENSOR_GAS           → Gaz bosimi (1x analog ADC)
;   -DSENSOR_ELECTRICITY   → Elektr hisoblagich (RS-485 DLMS TE71/TE73)
;   -DSENSOR_SOUND         → Ovoz darajasi (mikrofon ADC)
;
; [ULANISH — biri]
;   (bayroqsiz)            → Faqat WiFi (standart)
;   -DRS485_LEAF           → Bino ichi RS-485 leaf (WiFi/radio yo'q)
;   -DRS485_BRIDGE         → SENSOR_ELECTRICITY WiFi rejimiga qo'shiladi:
;                             bino ichi RS-485 shinasini so'rab, leaf
;                             o'qishlarini ham backend'ga forward qiladi
;
; [EKRAN — ixtiyoriy]
;   -DHAVE_LCD             → LCD 16x2 I2C bor
;   -DLCD_SDA=21           → LCD SDA pini (standart: 21)
;   -DLCD_SCL=22           → LCD SCL pini (standart: 22)
;
; [SOIL PIN/KALIBROVKA — ixtiyoriy override]
;   -DPIN_SOIL_ADC=32      → ADC GPIO (standart: 34)
;   -DSOIL_ADC_DRY=3300    → Havoda o'lchang va kiriting (standart: 3300)
;   -DSOIL_ADC_WET=1400    → Suvda o'lchang va kiriting (standart: 1400)
;
; [SOUND PIN/KALIBROVKA — ixtiyoriy override]
;   -DPIN_SOUND_ADC=34     → Mikrofon AOUT GPIO (standart: 34)
;   -DSOUND_SAMPLES=300    → Amplituda namunalar soni (standart: 300)
;   -DSOUND_CALIB_MS=5000  → Startup kalibrovka vaqti ms (standart: 5000)
;   -DSOUND_FIGHT_REF=200  → "100%" mos amplituda (standart: 200)
;   -DREAD_INTERVAL_MS=10000 → O'qish intervali ms (sound uchun 10s)
;
; [DEBUG]
;   -DCORE_DEBUG_LEVEL=5 -DAPP_DEBUG  → Serial monitor yoqiladi
; =============================================================================

[platformio]
default_envs = soil_debug

; ─── Umumiy sozlamalar ────────────────────────────────────────────────────────
[base]
platform    = espressif32@6.4.0
board       = esp32dev
framework   = arduino
monitor_speed   = 115200
monitor_filters = direct, time
build_unflags   = -std=gnu++11
build_flags =
    -std=gnu++17
    -DCORE_DEBUG_LEVEL=0
    '-DDEFAULT_SERVER_URL="https://ss.boos.uz"'
    '-DDEFAULT_DEVICE_TOKEN="T30gwzZJ6YTvQeLRMCZyTi-GBAYogsQV"'
board_build.partitions = min_spiffs.csv
upload_speed       = 115200
upload_resetmethod = nodemcu

; ─── Debug base (barcha debug envlar shu flaglarni oladi) ─────────────────────
[debug]
build_flags =
    -std=gnu++17
    -DCORE_DEBUG_LEVEL=5
    -DAPP_DEBUG
    -DTLS_INSECURE
    '-DDEFAULT_SERVER_URL="https://ss.boos.uz"'
    '-DDEFAULT_DEVICE_TOKEN="T30gwzZJ6YTvQeLRMCZyTi-GBAYogsQV"'

; ─── Kutubxonalar to'plamlari ─────────────────────────────────────────────────
[libs_base]
lib_deps =
    bblanchon/ArduinoJson@^6.21.4
    tzapu/WiFiManager@^2.0.17

[libs_lcd]
lib_deps =
    ${libs_base.lib_deps}
    marcoschwartz/LiquidCrystal_I2C@^1.1.4

; ─── Soil kalibrovka (barcha soil envlar uchun) ───────────────────────────────
[soil_pins]
build_flags =
    -DPIN_SOIL_ADC=34
    -DSOIL_ADC_DRY=3300
    -DSOIL_ADC_WET=1400

; =============================================================================
; TUPROQ NAMLIGI SENSORI
; =============================================================================

[env:soil_outdoor]
extends  = base
build_flags = ${base.build_flags} -DSENSOR_SOIL '-DSOIL_DEVICE_ROLE="soil_outdoor"' ${soil_pins.build_flags}
lib_deps = ${libs_base.lib_deps}

[env:soil_basement]
extends  = base
build_flags = ${base.build_flags} -DSENSOR_SOIL '-DSOIL_DEVICE_ROLE="soil_basement"' ${soil_pins.build_flags}
lib_deps = ${libs_base.lib_deps}

[env:soil_wifi_lcd]
extends  = base
build_flags = ${base.build_flags} -DSENSOR_SOIL -DHAVE_LCD ${soil_pins.build_flags}
lib_deps = ${libs_lcd.lib_deps}

[env:soil_wifi]
extends  = base
build_flags = ${base.build_flags} -DSENSOR_SOIL ${soil_pins.build_flags}
lib_deps = ${libs_base.lib_deps}

[env:soil_debug]
extends  = base
build_flags = ${debug.build_flags} -DSENSOR_SOIL -DHAVE_LCD ${soil_pins.build_flags}
lib_deps = ${libs_lcd.lib_deps}

; Eskirgan nom (eski skriptlar uchun)
[env:soil]
extends = env:soil_wifi_lcd

; =============================================================================
; OVOZ DARAJASI SENSORI (mikrofon ADC)
; =============================================================================

[env:sound_wifi_lcd]
extends  = base
build_flags = ${base.build_flags} -DSENSOR_SOUND -DHAVE_LCD -DPIN_SOUND_ADC=34 -DREAD_INTERVAL_MS=10000
lib_deps = ${libs_lcd.lib_deps}

[env:sound_wifi]
extends  = base
build_flags = ${base.build_flags} -DSENSOR_SOUND -DPIN_SOUND_ADC=34 -DREAD_INTERVAL_MS=10000 '-DDEFAULT_WIFI_SSID="TP-Link_CDCA"' '-DDEFAULT_WIFI_PASS="23163331"'
lib_deps = ${libs_base.lib_deps}

[env:sound_debug]
extends  = base
build_flags =
    ${debug.build_flags}
    -DSENSOR_SOUND
    -DHAVE_LCD
    -DLCD_ADDR=0x27
    -DPIN_SOUND_ADC=34
    -DSOUND_CALIB_MS=1000
    -DREAD_INTERVAL_MS=2000
lib_deps = ${libs_lcd.lib_deps}

; Eskirgan nom
[env:sound]
extends = env:sound_wifi_lcd

; =============================================================================
; ELEKTR HISOBLAGICH — TE71/TE73 (RS-485 DLMS)
; =============================================================================

[env:electricity]
extends  = base
build_flags = ${base.build_flags} -DSENSOR_ELECTRICITY -DHAVE_LCD
lib_deps = ${libs_lcd.lib_deps}

[env:electricity_debug]
extends  = base
build_flags = ${debug.build_flags} -DSENSOR_ELECTRICITY -DHAVE_LCD
lib_deps = ${libs_lcd.lib_deps}

[env:electricity_test]
extends  = base
build_flags = ${debug.build_flags} -DSENSOR_ELECTRICITY -DHAVE_LCD -DDEFAULT_TEST_MODE=1
lib_deps = ${libs_lcd.lib_deps}

; EX518 xom IEC62056-21 (Mode C) test — WiFi/sensor framework YO'Q,
; faqat RS-485 orqali ulanib, o'qishni Serial'ga chiqaradi. Mavjud
; electricity_* envlarga mutlaqo tegmaydi (main.cpp'da alohida
; #ifdef EX518_TEST blok). EX518 pasporti DLMS emas, IEC62056-21 deydi.
[env:ex518_test]
extends  = base
build_flags = ${debug.build_flags} -DEX518_TEST

; =============================================================================
; SUV BOSIMI SENSORI (2x analog ADC)
; =============================================================================

[env:water]
extends  = base
build_flags = ${base.build_flags} -DSENSOR_WATER
lib_deps =
    ${libs_base.lib_deps}
    adafruit/Adafruit ADS1X15@^2.5.0

[env:water_debug]
extends  = base
build_flags = ${debug.build_flags} -DSENSOR_WATER
lib_deps =
    ${libs_base.lib_deps}
    adafruit/Adafruit ADS1X15@^2.5.0

; =============================================================================
; GAZ BOSIMI SENSORI (ADS1115 + 4-20mA transmitter)
; =============================================================================

[env:gas]
extends  = base
build_flags = ${base.build_flags} -DSENSOR_GAS
lib_deps =
    ${libs_base.lib_deps}
    adafruit/Adafruit ADS1X15@^2.5.0

; =============================================================================
; QOZONXONA ISITISH SENSORI (DS18B20 x2)
; =============================================================================

[libs_heating]
lib_deps =
    ${libs_base.lib_deps}
    paulstoffregen/OneWire@^2.3.8
    milesburton/DallasTemperature@^3.11.0

[env:heating]
extends  = base
build_flags = ${base.build_flags} -DSENSOR_HEATING
lib_deps = ${libs_heating.lib_deps}

[env:heating_debug]
extends  = base
build_flags = ${debug.build_flags} -DSENSOR_HEATING -DHAVE_LCD
lib_deps =
    ${libs_heating.lib_deps}
    marcoschwartz/LiquidCrystal_I2C@^1.1.4

; =============================================================================
; TEST / MAXSUS MUHITLAR
; =============================================================================

[env:ads1115_test]
extends  = base
build_flags =
    -std=gnu++17
    -DCORE_DEBUG_LEVEL=5
    -DADS1115_TEST
    '-DDEFAULT_SERVER_URL="https://ss.boos.uz"'
    '-DDEFAULT_DEVICE_TOKEN="T30gwzZJ6YTvQeLRMCZyTi-GBAYogsQV"'
lib_deps =
    bblanchon/ArduinoJson@^6.21.4
    adafruit/Adafruit ADS1X15@^2.5.0

; =============================================================================
; BINO ICHI RS-485 SHINASI — "leaf" sensorlar + "bridge" (RS-485 -> WiFi)
;
; Arxitektura: bino ichidagi har bir sensor (suv/gaz/tuproq/ovoz) "leaf"
; sifatida RS-485 (2 sim, A/B) umumiy shinaga ulanadi — WiFi/radio kerak
; emas, arzon. Bitta "bridge" (o'z elektr hisoblagichini DLMS orqali o'qigan
; oddiy WiFi "electricity" rejimi ustiga qurilgan) shu shinani so'rab, kelgan
; har bir o'qishni backend'ga to'g'ridan-to'g'ri WiFi orqali (/api/readings)
; forward qiladi. Batafsil: iot_v2/include/rs485_bus.h, rs485_leaf.h,
; rs485_bridge.h.
; =============================================================================

; RS-485 shina self-test (bitta ESP32, sensor/WiFi yo'q — faqat freym protokoli)
; Pinlar 16/17/4 — modul elektr (DLMS) pinlariga ulangani uchun shu yerda test
; qilinadi. Kerak bo'lsa -DRS485_BUS_RX/TX/DE bilan o'zgartiring.
[env:rs485_selftest]
extends  = base
build_flags = ${base.build_flags} -DRS485_SELFTEST -DCORE_DEBUG_LEVEL=5 -DAPP_DEBUG
    -DRS485_BUS_RX=16 -DRS485_BUS_TX=17 -DRS485_BUS_DE=4
lib_deps = ${libs_base.lib_deps}

; 2 qurilma bus testi: MASTER (meter/WiFi'siz) — DISCOVER + adresli POLL.
; Ikkala modul BIR XIL pinlarda: RO->32, DI->33, DE+RE->25 (leaf bilan aynan bir xil).
[env:rs485_master_test]
extends  = base
build_flags = ${base.build_flags} -DRS485_MASTER_TEST -DHAVE_LCD -DCORE_DEBUG_LEVEL=5 -DAPP_DEBUG
lib_deps = ${libs_lcd.lib_deps}

; SUV DISPLEY — shinani passiv tinglaydi, suv bosimini LCD'ga chiqaradi (uzatmaydi).
; Ulanish: RO->32, DI->33, DE(+RE)->25, LCD I2C SDA=21 SCL=22.
; RS-485 XOM RX MONITOR — leaf pinlarida (32/33/25) shinadan xom bayt kelishini ko'radi
[env:rs485_rxmon]
extends  = base
build_flags = ${base.build_flags} -DRS485_RXMON -DAPP_DEBUG
lib_deps = ${libs_base.lib_deps}

[env:water_display]
extends  = base
build_flags = ${base.build_flags} -DRS485_DISPLAY
lib_deps = ${libs_lcd.lib_deps}

[env:water_rs485_leaf]
extends  = base
; PIN_WATER_PULSE 25 -> 26: RS-485 DE (GPIO25) bilan to'qnashmasin (impuls oqim sensori uchun)
build_flags = ${base.build_flags} -DSENSOR_WATER -DRS485_LEAF -DPIN_WATER_PULSE=26
lib_deps =
    ${libs_base.lib_deps}
    adafruit/Adafruit ADS1X15@^2.5.0

[env:gas_rs485_leaf]
extends  = base
build_flags = ${base.build_flags} -DSENSOR_GAS -DRS485_LEAF
lib_deps =
    ${libs_base.lib_deps}
    adafruit/Adafruit ADS1X15@^2.5.0

[env:soil_rs485_leaf]
extends  = base
build_flags = ${base.build_flags} -DSENSOR_SOIL -DRS485_LEAF ${soil_pins.build_flags}
lib_deps = ${libs_base.lib_deps}

; Yerto'la namligi (GPIO34) + MQ135 havo sifati (GPIO35) — SENSOR TEST (WiFi'siz, har 2s)
[env:soil_mq135_test]
extends  = base
build_flags = ${debug.build_flags} -DSOIL_MQ135_TEST ${soil_pins.build_flags}
lib_deps = ${libs_base.lib_deps}

; Yerto'la namligi + MQ135 — RS-485 LEAF (production)
[env:soil_mq135_rs485_leaf]
extends  = base
build_flags = ${base.build_flags} -DSENSOR_SOIL -DHAVE_MQ135 -DRS485_LEAF ${soil_pins.build_flags}
lib_deps = ${libs_base.lib_deps}

[env:sound_rs485_leaf]
extends  = base
build_flags = ${base.build_flags} -DSENSOR_SOUND -DRS485_LEAF -DPIN_SOUND_ADC=34
lib_deps = ${libs_base.lib_deps}

[env:heating_rs485_leaf]
extends  = base
build_flags = ${base.build_flags} -DSENSOR_HEATING -DRS485_LEAF
lib_deps = ${libs_heating.lib_deps}

; Tok (elektr) RS-485 leaf — "DLMS→JSON tarjimon". 2 MAX485:
;   Serial2 (16/17/4) = metr DLMS, Serial1 (32/33/25) = umumiy leaf shina.
; WiFi yo'q — natijani shinaga chiqaradi, bridge yig'adi. -DHAVE_LCD ixtiyoriy.
[env:electricity_rs485_leaf]
extends  = base
build_flags = ${base.build_flags} -DSENSOR_ELECTRICITY -DRS485_LEAF
lib_deps = ${libs_base.lib_deps}

[env:building_bridge]
extends  = base
build_flags = ${base.build_flags} -DSENSOR_ELECTRICITY -DHAVE_LCD -DRS485_BRIDGE
    -DWIFI_PORTAL_TIMEOUT_S=0
    '-DDEFAULT_WIFI_SSID="TP-Link_CDCA"' '-DDEFAULT_WIFI_PASS="23163331"'
lib_deps = ${libs_lcd.lib_deps}
