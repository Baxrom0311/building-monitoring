name: Frontend CI/CD

on:
  push:
    branches: [main]
    paths:
      - "meter-frontend-v2/**"
      - ".github/workflows/frontend.yml"
  pull_request:
    paths:
      - "meter-frontend-v2/**"
      - ".github/workflows/frontend.yml"

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: meter-frontend-v2

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: meter-frontend-v2/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npx tsc -b

      - name: Build
        env:
          VITE_API_URL: ""
        run: npm run build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: meter-frontend-v2/dist/
          retention-days: 7

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: dist/

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Rsync dist to server
        run: |
          RSYNC="rsync -az --delete --rsync-path=/usr/bin/rsync -e \"ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no\""
          # backend/frontend — kept for anything reading STATIC_DIR as a fallback
          eval $RSYNC dist/ ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/root/meter_backend/frontend/
          # /var/www/sss.boos.uz — the ACTUAL nginx docroot for ss.boos.uz (see
          # deploy/nginx/ss.boos.uz.conf's `root` directive). This is the path
          # that must be current for the live site to actually update — the
          # backend/frontend rsync above does NOT get served by nginx at all.
          eval $RSYNC dist/ ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/var/www/sss.boos.uz/

      - name: Fix ownership on live docroot
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "chown -R www-data:www-data /var/www/sss.boos.uz"
